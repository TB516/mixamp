name: mixamp
buildsystem: simple
build-options:
  append-path: /usr/lib/sdk/node24/bin
  build-args:
    - --share=network
build-commands:
  - pnpm install --frozen-lockfile
  - pnpm build
  - /usr/lib/sdk/node24/install.sh
  - install -Dm755 flatpak/mixamp /app/bin/mixamp
  - install -Dm644 dist/bundle.mjs /app/share/mixamp/bundle.mjs
  - install -Dm755 dist/gtkx.node /app/share/mixamp/gtkx.node
  - install -Dm644 flatpak/io.github.TB516.mixamp.desktop /app/share/applications/io.github.TB516.mixamp.desktop
  - install -Dm644 flatpak/io.github.TB516.mixamp.metainfo.xml /app/share/metainfo/io.github.TB516.mixamp.metainfo.xml
  - install -Dm644 assets/io.github.TB516.mixamp.svg /app/share/icons/hicolor/scalable/apps/io.github.TB516.mixamp.svg
sources:
  - type: dir
    path: ../..
    skip:
      - .flatpak-builder
      - .flatpak-dev
      - .git
      - build-flatpak
      - dist
      - node_modules
      - out-tsc
