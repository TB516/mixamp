id: io.github.TB516.mixamp
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: mixamp
appstream-compose: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-run/pipewire-0

cleanup:
  - /bin/pnpm
  - /bin/pnpx
  - /include
  - /lib/pnpm
  - /lib/pkgconfig
  - /share/gir-1.0
  - "*.a"
  - "*.la"

modules:
  - modules/wireplumber.yml
  - modules/pnpm.yml
  - modules/mixamp.yml
